services:
  - type: web
    name: ai-resume-screening
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "gunicorn App:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_FOLDER
        value: uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_SENDER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
