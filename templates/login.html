<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitAI — HR Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface2: #f1f5f9;
            --border: #e2e8f0;
            --border-md: #cbd5e1;
            
            --accent: #10b981;
            --accent-hover: #059669;
            --accent2: #3b82f6; /* Blue added for gradient */
            --accent-glow: rgba(16, 185, 129, 0.2);
            
            --text: #0f172a;
            --muted: #64748b;
            --muted2: #94a3b8;
            
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 10px 15px -3px rgba(0, 0, 0, 0.04);
            --shadow-input: inset 0 2px 4px rgba(0,0,0,0.02);
            --shadow-btn: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
        }
        
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* Dynamic Grid Background */
        body::before {
            content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
            background-image: radial-gradient(circle at center, rgba(16, 185, 129, 0.03) 0%, transparent 70%),
                              linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
        }
        
        /* Floating Glowing Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
        .orb1 { width: 450px; height: 450px; background: rgba(16, 185, 129, 0.15); top: -100px; right: -100px; animation: float1 12s ease-in-out infinite alternate; }
        .orb2 { width: 400px; height: 400px; background: rgba(59, 130, 246, 0.12); bottom: -100px; left: -100px; animation: float2 15s ease-in-out infinite alternate; }
        @keyframes float1 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-50px,50px) scale(1.1)} }
        @keyframes float2 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(50px,-50px) scale(1.05)} }

        .wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 1.5rem; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:none} }

        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-mark { width: 68px; height: 68px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 10px 25px var(--accent-glow); position: relative; overflow: hidden; }
        .logo-mark::after { content:''; position:absolute; inset:0; background: linear-gradient(135deg, transparent 40%, rgba(16,185,129,0.1) 50%, transparent 60%); background-size: 200% 200%; animation: shine 3s infinite linear; }
        @keyframes shine { 0% {background-position: 200% center} 100% {background-position: -200% center} }
        
        .logo-mark svg { width: 34px; height: 34px; color: var(--accent); position: relative; z-index: 1; }
        .logo-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.04em; color: var(--text); }
        .logo-sub { font-size: 0.9rem; color: var(--muted); margin-top: 2px; font-weight: 500; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 2.5rem; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
        .card-top-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

        /* Icon Input Fields */
        .field { margin-bottom: 1.2rem; }
        .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text); letter-spacing: 0.03em; margin-bottom: 0.6rem; }
        .input-group { position: relative; display: flex; align-items: center; }
        .input-group svg { position: absolute; left: 1rem; width: 18px; height: 18px; color: var(--muted2); transition: color 0.3s; }
        .input-group input { width: 100%; background: var(--surface2); border: 1.5px solid transparent; border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; padding: 0.9rem 1rem 0.9rem 2.8rem; outline: none; transition: all 0.3s ease; box-shadow: var(--shadow-input); }
        .input-group input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); transform: translateY(-2px); }
        .input-group input:focus + svg { color: var(--accent); }
        .input-group input::placeholder { color: var(--muted2); font-weight: 400; }

        /* Extra options row */
        .options { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; margin-bottom: 1.5rem; font-weight: 500; }
        .options label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
        .options input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
        .options a { color: var(--accent2); text-decoration: none; transition: 0.2s; }
        .options a:hover { color: var(--accent); text-decoration: underline; }

        /* Primary Animated Button */
        .btn-primary { width: 100%; padding: 1.05rem; background-image: linear-gradient(to right, var(--accent) 0%, var(--accent2) 50%, var(--accent) 100%); background-size: 200% auto; color: white; border: none; border-radius: 12px; font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.4s ease; box-shadow: var(--shadow-btn); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:hover { background-position: right center; transform: translateY(-3px); box-shadow: 0 12px 25px -4px rgba(16, 185, 129, 0.5); }
        .btn-primary:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
        .btn-primary svg { width: 18px; height: 18px; transition: transform 0.3s; }
        .btn-primary:hover svg { transform: translateX(4px); }

        /* Divider */
        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: var(--muted2); font-size: 0.8rem; font-weight: 600; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider span { padding: 0 10px; }

        /* Secondary Register Button */
        .btn-secondary { display: flex; align-items: center; justify-content: center; width: 100%; padding: 0.95rem; background: var(--surface); border: 2px dashed var(--border-md); color: var(--text); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.3s ease; }
        .btn-secondary:hover { border-style: solid; border-color: var(--accent); background: #f0fdf4; color: var(--accent-hover); transform: translateY(-2px); box-shadow: var(--shadow-sm); }

        .back { text-align: center; margin-top: 2rem; font-size: 0.85rem; font-weight: 600; }
        .back a { color: var(--muted); text-decoration: none; transition: color 0.2s; display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .back a:hover { color: var(--text); border-color: var(--border-md); transform: translateY(-1px); }
    </style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
    <div class="logo-area">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        </div>
        <div class="logo-name">RecruitAI</div>
        <div class="logo-sub">Welcome back, Recruiter</div>
    </div>

    <div class="card">
        <div class="card-top-line"></div>
        
        <form method="POST" id="lf" action="/login">
            <div class="field">
                <label>Username</label>
                <div class="input-group">
                    <input type="text" name="username" placeholder="e.g. hr_admin" required autofocus autocomplete="username">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
            
            <div class="field">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <div class="options">
                <label><input type="checkbox" name="remember"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary">
                Sign In 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="divider"><span>OR</span></div>
        
        <a href="/register" class="btn-secondary">
            Create an HR Account
        </a>
    </div>

    <div class="back">
        <a href="/">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Resume Screener
        </a>
    </div>
</div>
</body>
</html>
