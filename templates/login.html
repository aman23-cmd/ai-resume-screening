<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitAI — HR Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #09090b;
            --surface: rgba(24, 24, 27, 0.7);
            --surface-hover: rgba(39, 39, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #10b981;
            --accent-hover: #059669;
            --accent2: #6366f1;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --text-dim: #52525b;
            --radius-lg: 24px;
            --radius-md: 12px;
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        
        /* Consistent Background Effects */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: -1; opacity: 0.2; }
        .orb1 { width: 450px; height: 450px; background: var(--accent); top: -100px; right: -100px; animation: float1 12s ease-in-out infinite alternate; }
        .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; left: -100px; animation: float2 15s ease-in-out infinite alternate; }
        
        @keyframes float1 { 0%{transform:translate(0,0)} 100%{transform:translate(-30px,60px) scale(1.1)} }
        @keyframes float2 { 0%{transform:translate(0,0)} 100%{transform:translate(40px,-50px) scale(1.05)} }

        .wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 1.5rem; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:none} }

        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-mark { width: 64px; height: 64px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .logo-mark svg { width: 32px; height: 32px; color: var(--accent); }
        .logo-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.7rem; letter-spacing: -0.04em; }
        .logo-sub { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

        .card { 
            background: var(--surface); 
            backdrop-filter: blur(12px); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 2.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            position: relative; 
            overflow: hidden; 
        }

        /* Icon Input Fields */
        .field { margin-bottom: 1.25rem; }
        .field label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; }
        
        .input-group { position: relative; display: flex; align-items: center; }
        .input-group svg { position: absolute; left: 1rem; width: 18px; height: 18px; color: var(--text-dim); transition: color 0.3s; }
        
        .input-group input { 
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); 
            border-radius: 12px; color: white; font-size: 0.95rem; 
            padding: 0.9rem 1rem 0.9rem 2.8rem; outline: none; transition: all 0.2s ease; 
        }
        
        .input-group input:focus { 
            background: rgba(0,0,0,0.4); border-color: var(--accent); 
            box-shadow: 0 0 0 4px var(--accent-glow); 
        }
        .input-group input:focus + svg { color: var(--accent); }

        .options { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; margin-bottom: 1.5rem; }
        .options label { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; }
        .options input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
        .options a { color: var(--accent2); text-decoration: none; font-weight: 600; }
        .options a:hover { text-decoration: underline; }

        /* Button Styling */
        .btn-primary { 
            width: 100%; padding: 1.1rem; 
            background: var(--text-main); color: var(--bg); 
            border: none; border-radius: 12px; 
            font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 800; 
            cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
        }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-primary svg { width: 18px; height: 18px; }

        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider span { padding: 0 12px; }

        .btn-secondary { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; padding: 0.9rem; 
            background: transparent; border: 1px solid var(--border); 
            color: var(--text-main); border-radius: 12px; 
            font-size: 0.9rem; font-weight: 600; text-decoration: none; 
            transition: all 0.2s ease; 
        }
        .btn-secondary:hover { background: var(--surface-hover); border-color: var(--text-muted); }

        .back { text-align: center; margin-top: 2rem; }
        .back a { 
            color: var(--text-muted); text-decoration: none; font-size: 0.85rem; 
            font-weight: 600; display: inline-flex; align-items: center; gap: 6px; 
            padding: 8px 16px; border-radius: 100px; border: 1px solid var(--border); 
            transition: 0.2s; 
        }
        .back a:hover { color: var(--text-main); background: var(--surface); border-color: var(--text-muted); }

        .flash {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid transparent;
            animation: slideUp 0.4s ease;
        }

        .success { background: rgba(16, 185, 129, 0.1); color: var(--accent); border-color: rgba(16, 185, 129, 0.2); }
        .danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
    <div class="logo-area">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        </div>
        <div class="logo-name">RecruitAI</div>
        <div class="logo-sub">HR Terminal Access</div>
    </div>

    <!-- FLASH MESSAGES (Jinja2) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="card">
        <form method="POST" id="lf" action="/login">
            <div class="field">
                <label>Username</label>
                <div class="input-group">
                    <input type="text" name="username" placeholder="Enter HR ID" required autofocus autocomplete="username">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
            
            <div class="field">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <div class="options">
                <label><input type="checkbox" name="remember"> Keep me signed in</label>
                <a href="#">Reset Access</a>
            </div>

            <button type="submit" class="btn-primary">
                Sign In to Dashboard
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="divider"><span>OR SYSTEM ACCESS</span></div>
        
        <a href="/register" class="btn-secondary">
            Request New HR Account
        </a>
    </div>

    <div class="back">
        <a href="/">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Public Screener
        </a>
    </div>
</div>
</body>
</html>
