<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RecruitAI — 500 Server Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #ef4444;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 0;
        }
        .content { max-width: 400px; padding: 20px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 5rem; margin: 0; color: var(--accent); }
        p { color: var(--text-muted); margin: 20px 0 30px; }
        .btn {
            background: var(--accent);
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>500</h1>
        <h2>Server Error</h2>
        <p>Something went wrong on our end. We're looking into it.</p>
        <a href="/" class="btn">Try Again</a>
    </div>
</body>
</html>
